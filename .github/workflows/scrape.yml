name: Scrape leads (manual)

# Triggered by the dashboard "Scrape leads" button (via the GitHub dispatch API)
# or by hand from the Actions tab. No schedule — scraping is user-controlled,
# rate-limited to once/24h by the dashboard's server-side lock.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note shown in the run log
        required: false
        default: manual

permissions:
  contents: read

# Non-secret tunables — edit here, takes effect on the next run (no redeploy).
# Hunter is still hard-capped at HUNTER_DAILY_CAP per UTC day inside the agent.
env:
  LLM_MODEL: gpt-4o-mini
  HUNTER_DAILY_CAP: "15"
  # High-volume manual-apply mode: no emails sent, so scrape wide.
  MAX_JOBS_PER_RUN: "100"
  MIN_SCORE: "70"
  LOOKBACK_HOURS: "336"          # 14 days, wider pool
  SEND_THROTTLE_SECONDS: "30"
  # "remote" in the query is essential: without it JSearch returns onsite US
  # metro jobs (job_is_remote=false) that the geo filter drops. With it, results
  # are 100% genuinely-remote and pass through.
  # NOTE: NUM_PAGES=10 -> ~10 JSearch requests/run. Requires JSearch PRO
  # (10k/mo); the free 200/mo tier would exhaust mid-month.
  JSEARCH_QUERY: remote devops cloud sre platform engineer
  JSEARCH_NUM_PAGES: "10"
  # LinkedIn via Apify (main source). Locations must be real LinkedIn geos
  # ("Worldwide" is invalid); this set approximates worldwide-remote. Actor
  # min 150 results/run; ~$0.00074/job (200/run ~= $4.4/mo, within free credits).
  APIFY_KEYWORDS: devops engineer,cloud engineer,site reliability engineer,platform engineer
  APIFY_LOCATIONS: United States,United Kingdom,India,Pakistan
  APIFY_MAX_RESULTS: "200"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run pipeline (discover -> score -> enrich -> draft/send)
        run: python -m agent.pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
