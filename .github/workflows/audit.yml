name: Website audit outreach (daily + manual)

# Runs automatically once every 24h (cron) AND on demand from the dashboard
# "Run outreach" button / the Actions tab. Each run processes one batch
# (audit_settings.daily_send_cap leads) with randomized 15-40s gaps between
# sends so it doesn't look bursty. Send is gated by audit_settings.send_emails,
# so until that toggle is flipped on, a run just drafts every lead to 'dry_run'.
on:
  schedule:
    # 14:00 UTC every day — the automatic once-per-24h send.
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note shown in the run log
        required: false
        default: manual

permissions:
  contents: read

# Non-secret tunables — edit here, takes effect on the next run (no redeploy).
# The per-run batch size lives in audit_settings.daily_send_cap (dashboard).
env:
  LLM_MODEL: gpt-4o-mini
  # Randomized spacing between live sends: 15s base + 0-25s jitter => 15-40s
  # human-like gaps (no fixed-interval bot pattern). A 45-lead batch lands over
  # ~20 min. Tune for slower/safer drip by raising these.
  SEND_THROTTLE_SECONDS: "15"
  SEND_THROTTLE_JITTER_SECONDS: "25"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run audit outreach (fetch -> AI -> build HTML -> draft/send)
        run: python -m agent.audit.pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
