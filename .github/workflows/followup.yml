name: Follow-up engine (daily)

# Runs every day at 00:00 Pakistan time. GitHub cron is UTC only and Pakistan
# (PKT) is UTC+5 with no daylight saving, so 00:00 PKT == 19:00 UTC year-round.
# Also dispatchable by hand. Scheduled runs only fire on the default branch
# (main), and GitHub auto-disables schedules after 60 days of repo inactivity.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note shown in the run log
        required: false
        default: manual

permissions:
  contents: read

env:
  LLM_MODEL: gpt-4o-mini
  SEND_THROTTLE_SECONDS: "30"

jobs:
  followup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run follow-up (reply detection -> follow-ups -> status updates)
        run: python -m agent.followup
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
